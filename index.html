<!--
  Fórmulas Clínicas — estructura general del archivo:

  Esta página tiene solo DOS <section class="pantalla">: el menú
  (id="pantalla-menu") y un "cascarón" de fórmula reutilizable
  (id="pantalla-formula"). No hay una página HTML por cada
  fórmula — cuando tocas una tarjeta del menú, app.js reescribe
  el contenido de #contenido-formula con el HTML de Rabito, IMC,
  PC o TFG (function renderX() en app.js), y alterna cuál
  <section> se ve con la clase CSS "activa" (ver estilos.css).

  Los <svg> son íconos dibujados a mano con etiquetas <path>,
  <circle>, etc. (no son imágenes ni una librería de íconos) —
  currentColor hace que tomen el color de texto que le pongamos
  por CSS al elemento que los contiene.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fórmulas Clínicas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="theme-color" content="#1f5f5b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ===================== PANTALLA: MENÚ PRINCIPAL (HUB) ===================== -->
  <section id="pantalla-menu" class="pantalla activa">
    <header class="cabecera-hub">
      <p class="cabecera-eyebrow">Herramientas clínicas</p>
      <h1 class="cabecera-titulo">Fórmulas Clínicas</h1>
    </header>

    <main class="lista-formulas">

      <button class="tarjeta-formula" data-formula="rabito" type="button">
        <span class="tarjeta-icono" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 38C10 38 14 14 24 14C34 14 38 38 38 38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M14 20L10 16M34 20L38 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="14" r="2.5" fill="currentColor"/>
            <path d="M6 38H42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tarjeta-texto">
          <span class="tarjeta-nombre">Rabito</span>
          <span class="tarjeta-detalle">Peso estimado · paciente no ambulatorio</span>
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">→</span>
      </button>

      <button class="tarjeta-formula" data-formula="imc" type="button">
        <span class="tarjeta-icono" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="2.5"/>
            <path d="M24 24L31 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="24" r="2.5" fill="currentColor"/>
          </svg>
        </span>
        <span class="tarjeta-texto">
          <span class="tarjeta-nombre">IMC</span>
          <span class="tarjeta-detalle">Índice de masa corporal</span>
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">→</span>
      </button>

      <button class="tarjeta-formula" data-formula="pc" type="button">
        <span class="tarjeta-icono" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="16" r="7" stroke="currentColor" stroke-width="2.5"/>
            <path d="M11 39C11 30 16.5 25 24 25C31.5 25 37 30 37 39" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tarjeta-texto">
          <span class="tarjeta-nombre">PC</span>
          <span class="tarjeta-detalle">Peso estimado · parálisis cerebral (2-19 años)</span>
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">→</span>
      </button>

      <button class="tarjeta-formula" data-formula="tfg" type="button">
        <span class="tarjeta-icono" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 8C11 8 7 15 7 24C7 33 11 40 18 40C21 40 22 37 22 33V15C22 11 21 8 18 8Z" stroke="currentColor" stroke-width="2.5"/>
            <path d="M28 40C35 40 39 33 39 24C39 15 35 8 28 8C25 8 24 11 24 15V33C24 37 25 40 28 40Z" stroke="currentColor" stroke-width="2.5"/>
          </svg>
        </span>
        <span class="tarjeta-texto">
          <span class="tarjeta-nombre">Tasa de Filtración Glomerular</span>
          <span class="tarjeta-detalle">Función renal · adultos (18+)</span>
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">→</span>
      </button>

      <button class="tarjeta-formula" data-formula="pam" type="button">
        <span class="tarjeta-icono" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 40C24 40 8 30 8 18C8 12 12 8 17 8C20 8 23 10 24 13C25 10 28 8 31 8C36 8 40 12 40 18C40 30 24 40 24 40Z" stroke="currentColor" stroke-width="2.5"/>
            <path d="M14 22H19L22 15L26 29L29 22H34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="tarjeta-texto">
          <span class="tarjeta-nombre">Presión Arterial Media</span>
          <span class="tarjeta-detalle">Perfusión de órganos · adultos</span>
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">→</span>
      </button>

      <button class="tarjeta-formula" data-formula="glasgow" type="button">
        <span class="tarjeta-icono" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 24C4 24 12 10 24 10C36 10 44 24 44 24C44 24 36 38 24 38C12 38 4 24 4 24Z" stroke="currentColor" stroke-width="2.5"/>
            <circle cx="24" cy="24" r="7" stroke="currentColor" stroke-width="2.5"/>
          </svg>
        </span>
        <span class="tarjeta-texto">
          <span class="tarjeta-nombre">Escala de Glasgow</span>
          <span class="tarjeta-detalle">Nivel de consciencia</span>
        </span>
        <span class="tarjeta-flecha" aria-hidden="true">→</span>
      </button>

    </main>

    <footer class="pie-hub">
      <p>Los resultados son estimaciones y no sustituyen el juicio clínico.</p>
    </footer>
  </section>

  <!-- ===================== PANTALLA: DETALLE DE FÓRMULA (cascarón reutilizable) ===================== -->
  <section id="pantalla-formula" class="pantalla">
    <header class="cabecera-formula">
      <button id="btn-volver" class="btn-volver" type="button" aria-label="Volver al menú">←</button>
      <h2 id="titulo-formula" class="titulo-formula">Fórmula</h2>
      <button id="btn-reiniciar" class="btn-volver" type="button" aria-label="Reiniciar formulario">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 12a8 8 0 1 1-2.6-5.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <!-- Este <main> arranca vacío (con un texto de respaldo que casi
         nunca se llega a ver) porque su contenido real lo escribe
         app.js con JavaScript cada vez que entras a una fórmula
         distinta — ver contenidoFormula.innerHTML en app.js. -->
    <main id="contenido-formula" class="contenido-formula">
      <p class="placeholder-formula">Esta pantalla se construye en el siguiente paso.</p>
    </main>
  </section>

<script src="formulas.js"></script>
<script src="app.js"></script>
<script>
  // Registra el service worker para que la app funcione sin internet
  // después de la primera vez que se abre. Si el navegador no lo
  // soporta (muy raro hoy en día), la app sigue funcionando igual,
  // solo que sin el modo offline.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
